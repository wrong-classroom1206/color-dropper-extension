<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Color Dropper</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 260px;
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      padding: 16px;
      user-select: none;
    }

    /* ── Header ── */
    .header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 14px;
    }
    .header img { width: 22px; height: 22px; border-radius: 4px; }
    .header h1 {
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.04em;
      color: #94a3b8;
      text-transform: uppercase;
    }

    /* ── Pick button ── */
    #pickBtn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      width: 100%;
      padding: 9px 14px;
      background: #2563eb;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 13.5px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s;
      margin-bottom: 14px;
    }
    #pickBtn:hover  { background: #1d4ed8; }
    #pickBtn:active { transform: scale(0.97); }
    #pickBtn:disabled { background: #334155; color: #64748b; cursor: not-allowed; transform: none; }
    #pickBtn svg { flex-shrink: 0; }

    /* ── Color preview ── */
    #colorPreview {
      height: 72px;
      border-radius: 8px;
      background: #1e293b;
      border: 1px solid #334155;
      margin-bottom: 12px;
      transition: background-color 0.2s;
      position: relative;
      overflow: hidden;
    }
    #colorPreview .checkered {
      position: absolute; inset: 0;
      background-image:
        linear-gradient(45deg, #334155 25%, transparent 25%),
        linear-gradient(-45deg, #334155 25%, transparent 25%),
        linear-gradient(45deg, transparent 75%, #334155 75%),
        linear-gradient(-45deg, transparent 75%, #334155 75%);
      background-size: 12px 12px;
      background-position: 0 0, 0 6px, 6px -6px, -6px 0;
      opacity: 0.35;
    }

    /* ── Code rows ── */
    .code-row {
      display: flex;
      align-items: center;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 7px;
      padding: 7px 10px;
      margin-bottom: 8px;
      gap: 8px;
    }
    .code-label {
      font-size: 10px;
      font-weight: 700;
      color: #64748b;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      min-width: 28px;
    }
    .code-value {
      flex: 1;
      font-family: 'Cascadia Code', 'Fira Code', 'Courier New', monospace;
      font-size: 13px;
      color: #e2e8f0;
      letter-spacing: 0.02em;
    }
    .copy-btn {
      background: none;
      border: none;
      cursor: pointer;
      color: #475569;
      padding: 2px;
      border-radius: 4px;
      display: flex;
      align-items: center;
      transition: color 0.15s;
      flex-shrink: 0;
    }
    .copy-btn:hover { color: #94a3b8; }
    .copy-btn.copied { color: #22c55e; }

    /* ── History ── */
    .history-label {
      font-size: 10px;
      font-weight: 700;
      color: #475569;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: 7px;
      margin-top: 4px;
    }
    #historyRow {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      min-height: 28px;
    }
    .history-swatch {
      width: 26px;
      height: 26px;
      border-radius: 5px;
      border: 1.5px solid #334155;
      cursor: pointer;
      transition: transform 0.12s, border-color 0.12s;
      flex-shrink: 0;
    }
    .history-swatch:hover {
      transform: scale(1.18);
      border-color: #94a3b8;
    }
    .history-empty {
      font-size: 11px;
      color: #334155;
      align-self: center;
    }

    /* ── Status bar ── */
    #statusBar {
      font-size: 11px;
      color: #475569;
      text-align: center;
      margin-top: 10px;
      min-height: 14px;
      transition: color 0.2s;
    }
    #statusBar.success { color: #22c55e; }
    #statusBar.error   { color: #f87171; }
  </style>
</head>
<body>

  <div class="header">
    <img src="icon.png" alt="icon" />
    <h1>Color Dropper</h1>
  </div>

  <button id="pickBtn">
    <!-- eyedropper icon -->
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none"
         stroke="currentColor" stroke-width="2.2"
         stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 2l3 3-9 9-3-3z"/>
      <path d="M3 17l-1 4 4-1z"/>
      <line x1="15" y1="5" x2="19" y2="9"/>
    </svg>
    Pick a Color
  </button>

  <div id="colorPreview"><div class="checkered"></div></div>

  <div class="code-row">
    <span class="code-label">HEX</span>
    <span class="code-value" id="hexOutput">—</span>
    <button class="copy-btn" id="copyHex" title="Copy HEX">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none"
           stroke="currentColor" stroke-width="2.2"
           stroke-linecap="round" stroke-linejoin="round">
        <rect x="9" y="9" width="13" height="13" rx="2"/>
        <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
      </svg>
    </button>
  </div>

  <div class="code-row">
    <span class="code-label">RGB</span>
    <span class="code-value" id="rgbOutput">—</span>
    <button class="copy-btn" id="copyRgb" title="Copy RGB">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none"
           stroke="currentColor" stroke-width="2.2"
           stroke-linecap="round" stroke-linejoin="round">
        <rect x="9" y="9" width="13" height="13" rx="2"/>
        <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
      </svg>
    </button>
  </div>

  <div class="history-label">Recent Colors</div>
  <div id="historyRow">
    <span class="history-empty">No colors picked yet</span>
  </div>

  <div id="statusBar"></div>

  <script src="popup.js"></script>
</body>
</html>
